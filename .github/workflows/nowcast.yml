# Every 5 minutes: the newest KNMI precipitation nowcast (radar_forecast, now -> +2 h) as a COG in R2.
# GitHub often starts scheduled runs some minutes late; a small server can take this over later (docs/20 §8).
name: Nowcast + health (5 min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: nowcast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Newest nowcast
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: winemap-wx
          WX_STORE: r2
        run: python -m winemap_ingest.nowcast
      - name: Health check (site up, data fresh, jobs) -> monitor/state.json + ntfy on a change
        if: always()
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: winemap-wx
          WX_STORE: r2
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MONITOR_KEY: ${{ secrets.MONITOR_KEY }}  # /api/status of the site (winemap-nl worker/auth.js)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # keep-alive of the free plans (winemap-nl docs/39): the staging database, and once a day a PowerSync sync
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          KEEPALIVE_EMAIL: ${{ secrets.KEEPALIVE_EMAIL }}
          KEEPALIVE_PASSWORD: ${{ secrets.KEEPALIVE_PASSWORD }}
          POWERSYNC_LIVE_URL: ${{ secrets.POWERSYNC_LIVE_URL }}
          KEEPALIVE_LIVE_EMAIL: ${{ secrets.KEEPALIVE_LIVE_EMAIL }}
          KEEPALIVE_LIVE_PASSWORD: ${{ secrets.KEEPALIVE_LIVE_PASSWORD }}
          # read-only key of the private backup bucket (winemap-nl docs/30): warns when the laptop backup stops
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: python -m winemap_ingest.health
      - name: Alerts per vineyard (rain soon, heavy rain, frost) -> ntfy
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: winemap-wx
          WX_STORE: r2
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m winemap_ingest.alerts
