# Twice a day: DWD's ICON-EU forecast (6.5 km, 0-120 h; DWD open data) for the viewer's Europe view (backlog 1.6,
# docs/38 §10): 2 m temperature, rain (mm/h) and the frost night minimum, the 00 and 12 UTC runs.
name: Europe forecast (ICON-EU)

on:
  schedule:
    - cron: "50 3,15 * * *" # the 120 h step of the 00/12 UTC run is online after ~3.5 h
  workflow_dispatch:

concurrency:
  group: icon-eu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  icon-eu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Copy the newest run
        env:
          WX_STORE: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m winemap_ingest.icon_eu
