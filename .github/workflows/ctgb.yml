# The plant protection products authorised for wine grapes (Ctgb, CC0), once a day -> winemap-wx ctgb/wijndruif.json
# for the product choice in the Vineyard manager's log (winemap-nl docs/27).
name: Ctgb products

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ctgb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Products for wine grapes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: winemap-wx
          WX_STORE: r2
        run: python -m winemap_ingest.ctgb
