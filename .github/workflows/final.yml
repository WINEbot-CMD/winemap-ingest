# Once a day: when KNMI has updated its archive of final (gauge-adjusted) hourly sums, replace the real-time hours.
name: Final data (daily)

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

concurrency:
  group: rain # not at the same time as the hourly job: both write the hours and totals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replace real-time hours by final ones
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: winemap-wx
          WX_STORE: r2
        run: python -m winemap_ingest.rain final --zips /tmp/zips
